name: CI

on:
  push:
      branches: [main, 'claude/**']
        pull_request:
            branches: [main]

            jobs:
              lint:
                  runs-on: ubuntu-latest
                      steps:
                            - uses: actions/checkout@v4
                                  - uses: actions/setup-node@v4
                                          with:
                                                    node-version: '22'
                                                              cache: 'npm'
                                                                    - run: npm ci
                                                                          - run: npm run lint || true
                                                                                - run: npx tsc --noEmit
